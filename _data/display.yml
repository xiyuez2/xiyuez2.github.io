homepage:
  show_experience: true
  show_news: false        # set to true and add files under _news/ to show a news box
  show_projects: true     # every _showcase card (industry + research) with the click-to-filter tag bar
  show_selected_publications: false
  num_news: 10

projects:
  # The ONLY topics that appear in the filter bar and are clickable on cards, in display order.
  # Use these in `tags:` of _showcase/*.md; anything else goes in `keywords:` (shown, not clickable).
  filter_tags:
    - LLM / VLM
    - AI agent
    - Autonomous driving
    - AI for healthcare
    - Diffusion models / visual generative models
    - Video generation / understanding

# Feel free to replace the footer text if you would like to, but I will greatly appreciate it
# if you keep the link to the template so that more people can benefit from it. Thanks!
footer_text: >-
  <a href="https://github.com/luost26/academic-homepage" target="_blank"><i class="fas fa-pencil-ruler"></i> academic-homepage</a>
