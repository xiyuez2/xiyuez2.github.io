short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I'm a final-year Ph.D. candidate in Computer Engineering at the University of Illinois Urbana-Champaign (UIUC),
    advised by <a href="https://ece.illinois.edu/about/directory/faculty/kindrtnk" target="_blank">Prof. Volodymyr Kindratenko</a>.
    Before that, I received my M.S. from UIUC, advised by
    <a href="https://shenlong.web.illinois.edu/" target="_blank">Prof. Shenlong Wang</a>, where I worked on
    generative models for autonomous driving, and my bachelor's degrees from the ZJU-UIUC Institute.
  </p>
  <p>
    My research centers on <strong>large language and vision-language models</strong>, in particular
    <strong>reinforcement learning–based post-training</strong> and <strong>AI agents</strong>. I also have
    substantial experience with <strong>visual generative models</strong> such as diffusion and video generation.
    Across these areas, I am especially interested in turning imperfect feedback, such as online user signals,
    LLM judgments, and visual quality metrics, into reliable training rewards for open-ended tasks. My work spans
    applications in e-commerce search, web automation, medical report generation, and video creation, as well as
    generative models for autonomous driving earlier in my PhD. I regularly serve as a reviewer for CVPR, ECCV,
    and NeurIPS.
  </p>
  <p>
    <strong>I am graduating in December 2026 and looking for full-time positions in VLMs, AI agents, and video
    generation. Feel free to reach out!</strong>
  </p>


